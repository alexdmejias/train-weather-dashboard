# Copy to config.toml and edit.  (config.toml is git-ignored.)

[display]
clock = "12h"                 # "12h" or "24h"
units = "fahrenheit"          # "fahrenheit" or "celsius"
location_name = "Brooklyn"    # shown on the weather card

[weather]
latitude = 40.6924
longitude = -73.9874
refresh_minutes = 15

[trains]
provider = "mta_subway"       # or "mock" for fake data while designing
mock_scenario = "normal"      # mock only: normal | evening | rain | night | snow
station_name = "Jay St-MetroTech"
refresh_seconds = 30          # the MTA feeds update about every 30 s
max_rows = 5
walk_minutes = 0              # hide trains leaving sooner than you can reach the platform

[trains.mta_subway]
# Station ids — find yours with:  python3 tools/find_station.py "jay st"
# A station complex can have one id per line group; list them all.
stations = ["A41", "R29"]
# directions = ["N"]          # optional: "N" = uptown/Bronx/Queens-bound, "S" = downtown/Brooklyn-bound
# routes = ["A", "C", "F"]    # optional: only these lines
